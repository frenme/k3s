apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: k3s-base
servers: 1
agents: 2
kubeAPI:
  hostIP: 127.0.0.1
  hostPort: "6550"
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --disable=coredns
        nodeFilters:
          - server:*
      - arg: --node-taint=role=edge:NoSchedule
        nodeFilters:
          - agent:*
    nodeLabels:
      - label: role=core
        nodeFilters:
          - server:0
      - label: role=edge
        nodeFilters:
          - agent:*
      - label: svccontroller.k3s.cattle.io/enablelb=true
        nodeFilters:
          - agent:*
