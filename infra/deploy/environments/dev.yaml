namespace: app-dev
kubeContext: k3s-dev
domain: api.dev.example.com
acmeEmail: REPLACE_WITH_ACME_EMAIL
clusterIssuer: letsencrypt-staging
backups: false

appDefaults:
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
  pdb:
    enabled: false

postgres:
  pooler:
    instances: 1

telemetry:
  metrics: false
  traces: false
