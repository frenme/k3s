namespace: app-dev
kubeContext: k3s-dev
subdomain: dev

appDefaults:
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
  pdb:
    enabled: false

apps:
  gateway:
    values:
      env:
        CORS_ORIGINS: https://dev.example.com

postgres:
  pooler:
    instances: 1

telemetry:
  metrics: false
  traces: false

releaseValues:
  postgres:
    storage: {size: 10Gi}
  redis:
    maxmemory: 128mb
