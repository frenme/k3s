namespace: app-dev
kubeContext: k3s-dev
acmeEmail: REPLACE_WITH_ACME_EMAIL
clusterIssuer: letsencrypt-staging
k3sVersion: v1.35.9+k3s1
telemetryRetention: 168h

appDefaults:
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
  pdb:
    enabled: false

postgres:
  backupServerName: postgres
  instances: 1

backup:
  destinationPath: s3://k3s-backups/dev/
  endpointURL: https://s3.example.com

telemetry:
  metrics: false
  traces: false
