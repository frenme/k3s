namespace: app-prod
kubeContext: k3s-prod
domain: api.example.com
acmeEmail: REPLACE_WITH_ACME_EMAIL
clusterIssuer: letsencrypt-prod
backups: true

appDefaults:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi
  autoscaling:
    scaleDownStabilizationSeconds: 300

apps:
  users:
    values:
      env:
        DB_MAX_CONNS: "15"
      autoscaling:
        maxReplicas: 8
  orders:
    values:
      env:
        DB_MAX_CONNS: "15"
      autoscaling:
        maxReplicas: 8

telemetry:
  retention:
    metrics: 30d
    logs: 336h
