# yaml-language-server: $schema=apps.schema.json
namespace: app-prod
kubeContext: k3s-prod
subdomain: prod
autoUpdates: true

appDefaults:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi
  autoscaling:
    scaleDownStabilizationSeconds: 300

apps:
  gateway:
    values:
      env:
        CORS_ORIGINS: https://{domain}
      ingress:
        routes:
          users:
            rateLimit:
              average: 600
              burst: 200
          orders:
            rateLimit:
              average: 300
              burst: 100
          common:
            rateLimit:
              average: 1200
              burst: 400
          api:
            rateLimit:
              average: 1200
              burst: 400
  users:
    values:
      env:
        DB_MAX_CONNS: "15"
      autoscaling:
        maxReplicas: 8
  orders:
    values:
      env:
        DB_MAX_CONNS: "15"
      autoscaling:
        maxReplicas: 8

telemetry:
  retention:
    metrics: 30d
    logs: 336h

releaseValues:
  monitoring:
    prometheus:
      prometheusSpec:
        retentionSize: 25GB
        storageSpec: {volumeClaimTemplate: {spec: {resources: {requests: {storage: 30Gi}}}}}
  loki:
    singleBinary:
      persistence: {size: 20Gi}
  tempo:
    persistence: {size: 20Gi}
  postgres:
    storage: {size: 50Gi}
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {memory: 4Gi}
    parameters:
      max_connections: "300"
      shared_buffers: 1GB
      effective_cache_size: 3GB
      max_wal_size: 4GB
      max_slot_wal_keep_size: 10GB
    backup: {retention: 30d}
  redis:
    maxmemory: 512mb
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 640Mi}
