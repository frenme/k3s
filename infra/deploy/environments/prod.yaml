# yaml-language-server: $schema=apps.schema.json
namespace: app-prod
kubeContext: k3s-prod
subdomain: prod

appDefaults:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi
  autoscaling:
    scaleDownStabilizationSeconds: 300

apps:
  gateway:
    values:
      env:
        CORS_ORIGINS: https://example.com
      ingress:
        routes:
          users:
            rateLimit:
              average: 600
              burst: 200
          orders:
            rateLimit:
              average: 300
              burst: 100
          common:
            rateLimit:
              average: 1200
              burst: 400
          api:
            rateLimit:
              average: 1200
              burst: 400
  users:
    values:
      env:
        DB_MAX_CONNS: "15"
      autoscaling:
        maxReplicas: 8
  orders:
    values:
      env:
        DB_MAX_CONNS: "15"
      autoscaling:
        maxReplicas: 8

telemetry:
  retention:
    metrics: 30d
    logs: 336h
