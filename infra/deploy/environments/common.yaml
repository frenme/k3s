# yaml-language-server: $schema=apps.schema.json
apps:
  users: {}
  orders: {}
  common:
    healthCheck: true
    values:
      env:
        DB_MAX_CONNS: "5"
  admin:
    readAllSchemas: true
    values:
      replicas: 1
      env:
        DB_MAX_CONNS: "5"
  scheduler:
    route: false
    values:
      replicas: 2
  gateway:
    gateway: true
    values:
      kind: DaemonSet
      terminationGracePeriodSeconds: 90
      nodeSelector:
        role: edge
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      networkPolicy:
        enabled: false
      ingress:
        enabled: true
        routes:
          users:
            path: /api/v1/users
            rateLimit:
              average: 120
              period: 1m
              burst: 40
          orders:
            path: /api/v1/orders
            rateLimit:
              average: 60
              period: 1m
              burst: 20
          health:
            path: /api/v1/common/health
            pathType: Exact
            rateLimit:
              average: 10
              period: 1m
              burst: 5
          common:
            path: /api/v1/common
            rateLimit:
              average: 300
              period: 1m
              burst: 100
          admin:
            path: /api/v1/admin
            rateLimit:
              average: 30
              period: 1m
              burst: 10
          api:
            path: /api
            rateLimit:
              average: 300
              period: 1m
              burst: 100

domain: example.com

cloudflareOnly: false

k3sVersion: v1.35.9+k3s1

autoUpdates: false

backups: false

s3:
  endpoint: s3.example.com
  bucket: k3s-backups

postgres:
  instances: 1
  pooler:
    instances: 2

telemetry:
  metrics: true
  traces: true
  retention:
    metrics: 15d
    logs: 168h
