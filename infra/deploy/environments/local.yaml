namespace: app
kubeContext: k3d-k3s-base

appDefaults:
  autoscaling:
    minReplicas: 1
    maxReplicas: 4
  pdb:
    enabled: false

apps:
  gateway:
    values:
      env:
        CORS_ORIGINS: http://localhost:5173,http://localhost:3000

postgres:
  pooler:
    instances: 1

telemetry:
  retention:
    metrics: 2d
    logs: 48h

secrets:
  dbSecret: dev-db-secret
  redis: dev-redis-password
  jwt: dev-jwt-secret
  grafana: dev-grafana-password

releaseValues:
  loki:
    singleBinary:
      resources: {requests: {cpu: 50m, memory: 128Mi}}
      persistence: {size: 2Gi}
  monitoring:
    prometheus:
      prometheusSpec:
        resources: {requests: {cpu: 100m, memory: 256Mi}}
        storageSpec: {volumeClaimTemplate: {spec: {resources: {requests: {storage: 2Gi}}}}}
    alertmanager: {enabled: false}
  postgres:
    storage: {size: 2Gi}
  tempo:
    persistence: {size: 2Gi}
