namespace: app
kubeContext: k3d-k3s-base
acmeEmail: ""
clusterIssuer: ""
k3sVersion: ""
telemetryRetention: 48h

appDefaults:
  autoscaling:
    minReplicas: 1
    maxReplicas: 4
  pdb:
    enabled: false

postgres:
  backupServerName: postgres
  instances: 1

secrets:
  postgres:
    users: dev-users-password
    orders: dev-orders-password
  redis: dev-redis-password
  grafana: dev-grafana-password
