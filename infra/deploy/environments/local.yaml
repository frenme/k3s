namespace: app
kubeContext: k3d-k3s-base

appDefaults:
  autoscaling:
    minReplicas: 1
    maxReplicas: 4
  pdb:
    enabled: false

apps:
  gateway:
    values:
      env:
        CORS_ORIGINS: http://localhost:5173,http://localhost:3000

postgres:
  pooler:
    instances: 1

telemetry:
  retention:
    metrics: 2d
    logs: 48h

secrets:
  dbSecret: dev-db-secret
  redis: dev-redis-password
  jwt: dev-jwt-secret
  grafana: dev-grafana-password
