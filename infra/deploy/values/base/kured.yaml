configuration:
  period: 1h
  rebootDays: [mo, tu, we, th, fr, sa]
  startTime: "02:00"
  endTime: "05:00"
  timeZone: UTC
  drainTimeout: 15m
  prometheusUrl: http://monitoring-prometheus.monitoring:9090
  alertFilterRegexp: ^(Watchdog|InfoInhibitor)$

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

tolerations:
  - operator: Exists
