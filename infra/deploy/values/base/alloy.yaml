fullnameOverride: alloy

alloy:
  enableReporting: false
  storagePath: /var/lib/alloy/data
  mounts:
    varlog: true
    extra:
      - name: data
        mountPath: /var/lib/alloy/data
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}

        stage.label_drop {
          values = ["filename"]
        }

        stage.replace {
          expression = "(?i)(?:password|passwd|pwd|secret|token|api[_-]?key)[\"']?\\s*[:=]\\s*[\"']?([^\"'\\s,&}]+)"
          replace    = "***"
        }
        stage.replace {
          expression = "(?i)authorization[\"']?\\s*[:=]\\s*[\"']?(?:bearer\\s+|basic\\s+)?([^\"'\\s,}]+)"
          replace    = "***"
        }
        stage.replace {
          expression = "[a-zA-Z][a-zA-Z0-9+.-]*://[^:/\\s\"'@]+:([^@/\\s\"']+)@"
          replace    = "***"
        }
        stage.replace {
          expression = "(eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+)"
          replace    = "***"
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

controller:
  tolerations:
    - operator: Exists
  volumes:
    extra:
      - name: data
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate
