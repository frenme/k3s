env:
  DB_MAX_CONNS: "10"

nodeSelector:
  role: core

spread:
  enabled: true

pdb:
  enabled: true

networkPolicy:
  enabled: true
  allowFromNamespaces:
    - monitoring
  allowFromPods:
    - gateway
    - orders

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

metrics:
  serviceMonitor:
    enabled: true
