env:
  CORS_ORIGINS: ""

terminationGracePeriodSeconds: 90

nodeSelector:
  role: edge

pdb:
  enabled: true

ingress:
  enabled: true
  routes:
    users:
      path: /api/users
      rateLimit:
        average: 120
        period: 1m
        burst: 40
    orders:
      path: /api/orders
      rateLimit:
        average: 60
        period: 1m
        burst: 20
    api:
      path: /api
      rateLimit:
        average: 300
        period: 1m
        burst: 100
