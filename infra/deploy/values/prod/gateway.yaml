resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

env:
  CORS_ORIGINS: https://example.com

ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: api.example.com
  tlsSecretName: api-example-com-tls
  routes:
    users:
      rateLimit:
        average: 600
        burst: 200
    orders:
      rateLimit:
        average: 300
        burst: 100
    common:
      rateLimit:
        average: 1200
        burst: 400
    api:
      rateLimit:
        average: 1200
        burst: 400
