{{- range $svc, $cfg := .Values.services }}
{{- if not $cfg.password }}
{{- fail (printf "services.%s.password must be set" $svc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.name }}-{{ $svc }}
  labels:
    {{- include "postgres.labels" $ | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ $svc }}_svc
  password: {{ $cfg.password | quote }}
---
{{- end }}
{{- if or .Values.backup.enabled .Values.restore.enabled }}
{{- if not (and .Values.backup.accessKeyId .Values.backup.secretAccessKey) }}
{{- fail "backup.accessKeyId and backup.secretAccessKey must be set" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-s3
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  ACCESS_KEY_ID: {{ .Values.backup.accessKeyId | quote }}
  ACCESS_SECRET_KEY: {{ .Values.backup.secretAccessKey | quote }}
{{- end }}
