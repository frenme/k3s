{{- if .Values.services }}
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-app
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  name: app
  owner: app
  cluster:
    name: postgres
  schemas:
    {{- range $svc, $cfg := .Values.services }}
    - name: {{ $svc }}
      owner: {{ $svc }}_svc
      ensure: present
    {{- end }}
{{- end }}
