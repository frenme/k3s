{{- if or .Values.backup.enabled .Values.restore.enabled }}
{{- if not (and .Values.backup.destinationPath .Values.backup.endpointURL) }}
{{- fail "backup.destinationPath and backup.endpointURL must be set" }}
{{- end }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-backup
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  retentionPolicy: {{ .Values.backup.retention | quote }}
  configuration:
    destinationPath: {{ .Values.backup.destinationPath }}
    endpointURL: {{ .Values.backup.endpointURL }}
    s3Credentials:
      accessKeyId:
        name: postgres-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
{{- end }}
{{- if .Values.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
