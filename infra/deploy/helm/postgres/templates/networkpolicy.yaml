apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        {{- if .Values.pooler.enabled }}
        - podSelector:
            matchExpressions:
              - key: cnpg.io/poolerName
                operator: Exists
        {{- end }}
        {{- range $svc, $_ := .Values.services }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $svc }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 8000
          protocol: TCP
        - port: 9187
          protocol: TCP
