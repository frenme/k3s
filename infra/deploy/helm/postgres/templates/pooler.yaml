{{- if .Values.pooler.enabled }}
{{- $clients := max 1 (len .Values.services) }}
{{- $budget := sub (int .Values.parameters.max_connections) (int .Values.pooler.reservedConnections) }}
{{- $poolSize := max 2 (div $budget (mul (int .Values.pooler.instances) $clients)) }}
{{- $types := list "rw" }}
{{- if gt (int .Values.instances) 1 }}
{{- $types = append $types "ro" }}
{{- end }}
{{- range $type := $types }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: postgres-pooler-{{ $type }}
  labels:
    {{- include "postgres.labels" $ | nindent 4 }}
spec:
  cluster:
    name: postgres
  type: {{ $type }}
  instances: {{ $.Values.pooler.instances }}
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: {{ $.Values.pooler.maxClientConn | quote }}
      default_pool_size: {{ $poolSize | quote }}
  template:
    spec:
      containers: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    cnpg.io/poolerName: postgres-pooler-{{ $type }}
---
{{- end }}
{{- end }}
