instances: 2

image: ghcr.io/cloudnative-pg/postgresql:17

services: {}

pooler:
  enabled: false
  instances: 2
  maxClientConn: 1000
  reservedConnections: 20

storage:
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

parameters:
  max_connections: "200"
  shared_buffers: 128MB
  effective_cache_size: 384MB
  max_slot_wal_keep_size: 2GB

backup:
  enabled: false
  serverName: ""
  destinationPath: ""
  endpointURL: ""
  retention: 7d
  accessKeyId: ""
  secretAccessKey: ""

restore:
  enabled: false
  serverName: postgres
