apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      annotations:
        svccontroller.k3s.cattle.io/tolerations: '[{"key":"role","operator":"Equal","value":"edge","effect":"NoSchedule"}]'
      spec:
        externalTrafficPolicy: Local
    deployment:
      kind: DaemonSet
    nodeSelector:
      role: edge
    tolerations:
      - key: role
        operator: Equal
        value: edge
        effect: NoSchedule
    {{- if .Values.httpsRedirect }}
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    {{- end }}
