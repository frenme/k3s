apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      annotations:
        svccontroller.k3s.cattle.io/tolerations: '[{"key":"role","operator":"Equal","value":"edge","effect":"NoSchedule"}]'
      spec:
        externalTrafficPolicy: Local
    deployment:
      kind: DaemonSet
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 1536Mi
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 3
    nodeSelector:
      role: edge
    tolerations:
      - key: role
        operator: Equal
        value: edge
        effect: NoSchedule
    {{- if .Values.trustedProxies }}
    ports:
      web:
        forwardedHeaders:
          trustedIPs: {{ toJson .Values.trustedProxies }}
      websecure:
        forwardedHeaders:
          trustedIPs: {{ toJson .Values.trustedProxies }}
    {{- end }}
