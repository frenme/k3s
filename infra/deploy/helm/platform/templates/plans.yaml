{{- with .Values.k3sVersion }}
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: cattle-system
spec:
  concurrency: 1
  cordon: true
  version: {{ . }}
  serviceAccountName: system-upgrade-controller
  window:
    {{- toYaml $.Values.upgradeWindow | nindent 4 }}
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  tolerations:
    - operator: Exists
  upgrade:
    image: rancher/k3s-upgrade
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: cattle-system
spec:
  concurrency: 1
  version: {{ . }}
  serviceAccountName: system-upgrade-controller
  window:
    {{- toYaml $.Values.upgradeWindow | nindent 4 }}
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  tolerations:
    - operator: Exists
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server"]
  drain:
    force: true
    skipWaitForDeleteTimeout: 60
  upgrade:
    image: rancher/k3s-upgrade
{{- end }}
