{{- if .Values.acme.email }}
{{- if or (contains "example.com" .Values.acme.email) (contains "REPLACE" .Values.acme.email) }}
{{- fail (printf "acme.email %q is a placeholder, set a real address" .Values.acme.email) }}
{{- end }}
{{- range $name, $server := dict "letsencrypt-staging" "https://acme-staging-v02.api.letsencrypt.org/directory" "letsencrypt-prod" "https://acme-v02.api.letsencrypt.org/directory" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    email: {{ $.Values.acme.email }}
    server: {{ $server }}
    privateKeySecretRef:
      name: {{ $name }}-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
{{- end }}
{{- end }}
