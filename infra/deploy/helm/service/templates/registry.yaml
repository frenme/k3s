{{- with .Values.registryAuth }}
{{- if .server }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service.fullname" $ }}-registry
  labels:
    {{- include "service.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .server (dict "username" .username "password" .password "auth" (printf "%s:%s" .username .password | b64enc))) | toJson | b64enc }}
{{- end }}
{{- end }}
