{{- if .Values.ingress.enabled }}
{{- $root := . }}
{{- $ingress := .Values.ingress }}
{{- range $route, $r := $ingress.routes }}
{{- $name := printf "%s-%s" (include "service.fullname" $root) $route }}
{{- if $r.rateLimit }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" $root | nindent 4 }}
spec:
  rateLimit:
    average: {{ $r.rateLimit.average }}
    period: {{ default "1s" $r.rateLimit.period }}
    burst: {{ default $r.rateLimit.average $r.rateLimit.burst }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" $root | nindent 4 }}
  {{- if $r.rateLimit }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ $root.Release.Namespace }}-{{ $name }}@kubernetescrd
  {{- end }}
spec:
  ingressClassName: traefik
  {{- if and $ingress.tlsSecretName $ingress.host }}
  tls:
    - secretName: {{ $ingress.tlsSecretName }}
      hosts:
        - {{ $ingress.host | quote }}
  {{- end }}
  rules:
    - {{- with $ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ $r.path }}
            pathType: {{ default "Prefix" $r.pathType }}
            backend:
              service:
                name: {{ include "service.fullname" $root }}
                port:
                  name: http
---
{{- end }}
{{- end }}
