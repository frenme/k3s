{{- if .Values.secretEnv }}
{{- range $k, $v := .Values.secretEnv }}
{{- if eq (toString $v) "" }}
{{- fail (printf "secretEnv.%s must be set" $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
