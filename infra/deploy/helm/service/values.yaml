image:
  repository: k3s-base/service
  tag: dev

kind: Deployment

singleton: false

imagePullSecrets: []

env: {}

secretEnv: {}

tracing:
  endpoint: ""
  environment: ""

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

terminationGracePeriodSeconds: 30

nodeSelector: {}

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 120

pdb:
  enabled: false

ingress:
  enabled: false
  annotations: {}
  host: ""
  tlsSecretName: ""
  routes: {}

networkPolicy:
  enabled: false
  allowFromPods: []
  allowFromNamespaces: []
  internalFromPods: []
