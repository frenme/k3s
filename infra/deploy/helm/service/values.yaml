image:
  repository: k3s-base/service
  tag: dev

kind: Deployment

replicas: 0

imagePullSecrets: []

env: {}

secretEnv: {}

tracing:
  endpoint: ""
  environment: ""

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

terminationGracePeriodSeconds: 30

nodeSelector: {}

tolerations: []

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 120

pdb:
  enabled: true

ingress:
  enabled: false
  host: ""
  routes: {}

networkPolicy:
  enabled: true
  allowFromPods: []
  allowFromNamespaces:
    - monitoring
  internalFromPods: []
