apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
type: Opaque
stringData:
  s3.json: |
    {"identities":[{"name":"admin","credentials":[{"accessKey":{{ required "accessKeyId" .Values.accessKeyId | quote }},"secretKey":{{ required "secretAccessKey" .Values.secretAccessKey | quote }}}],"actions":["Admin","Read","Write","List","Tagging"]}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        checksum/config: {{ toYaml .Values | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: s3
          image: {{ .Values.image }}
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/s3/s3.json", "-master.volumeSizeLimitMB=64"]
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/s3
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
        - name: config
          secret:
            secretName: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  ports:
    - name: s3
      port: 8333
      targetPort: s3
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
