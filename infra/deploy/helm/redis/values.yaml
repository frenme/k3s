image:
  repository: redis
  tag: 7-alpine
  pullPolicy: IfNotPresent

auth:
  password: ""

maxmemory: 256mb

maxmemoryPolicy: allkeys-lru

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 320Mi

nodeSelector: {}

tolerations: []

nodeFailureTolerationSeconds: 30

networkPolicy:
  enabled: true
