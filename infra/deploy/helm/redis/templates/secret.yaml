{{- if not .Values.auth.password }}
{{- fail "set auth.password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  password: {{ .Values.auth.password | quote }}
  redis.conf: |
    save ""
    appendonly no
    maxmemory {{ .Values.maxmemory }}
    maxmemory-policy {{ .Values.maxmemoryPolicy }}
    lazyfree-lazy-eviction yes
    lazyfree-lazy-expire yes
    tcp-keepalive 60
    requirepass {{ .Values.auth.password | quote }}
