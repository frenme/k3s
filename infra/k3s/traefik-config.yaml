apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
    additionalArguments:
      - "--entryPoints.web.forwardedHeaders.insecure=false"
    deployment:
      kind: DaemonSet
