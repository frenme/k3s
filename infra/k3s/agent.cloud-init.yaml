#cloud-config
write_files:
  - path: /etc/rancher/k3s/config.yaml
    permissions: "0600"
    content: |
      server: https://REPLACE_WITH_SERVER_IP:6443
      token: REPLACE_WITH_CLUSTER_TOKEN
      node-external-ip: REPLACE_WITH_PUBLIC_IP
      node-label:
        - role=edge
        - topology.kubernetes.io/region=REPLACE_WITH_REGION
runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw default allow routed
  - ufw allow 22,80,443/tcp
  - ufw allow 51820:51821/udp
  - ufw allow in on cni0
  - ufw allow in on flannel-wg
  - ufw allow from REPLACE_WITH_NODES_CIDR to any port 10250 proto tcp
  - ufw --force enable
  - curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.35.5+k3s1 sh -s - agent
