#cloud-config
write_files:
  - path: /etc/rancher/k3s/config.yaml
    permissions: "0600"
    content: |
      token: REPLACE_WITH_CLUSTER_TOKEN
      cluster-init: true
      node-external-ip: REPLACE_WITH_PUBLIC_IP
      tls-san:
        - REPLACE_WITH_PUBLIC_IP
      flannel-backend: wireguard-native
      flannel-external-ip: true
      write-kubeconfig-mode: "0600"
      node-label:
        - role=core
        - topology.kubernetes.io/region=eu
      etcd-snapshot-schedule-cron: "0 */6 * * *"
      etcd-snapshot-retention: 28
      etcd-s3: true
      etcd-s3-endpoint: s3.example.com
      etcd-s3-bucket: k3s-backups
      etcd-s3-folder: etcd
      etcd-s3-access-key: REPLACE_WITH_S3_ACCESS_KEY
      etcd-s3-secret-key: REPLACE_WITH_S3_SECRET_KEY
runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw default allow routed
  - ufw allow 22,80,443/tcp
  - ufw allow 51820:51821/udp
  - ufw allow in on cni0
  - ufw allow in on flannel-wg
  - ufw allow from REPLACE_WITH_NODES_CIDR to any port 6443,10250 proto tcp
  - ufw --force enable
  - curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.35.5+k3s1 sh -s - server
