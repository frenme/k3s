version: "2"

run:
  build-tags:
    - e2e
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    depguard:
      rules:
        users:
          files:
            - "**/internal/users/**"
          deny:
            - pkg: github.com/egor/k3s-base/internal/orders
              desc: services talk to each other over HTTP through internal/clients
        orders:
          files:
            - "**/internal/orders/**"
          deny:
            - pkg: github.com/egor/k3s-base/internal/users
              desc: services talk to each other over HTTP through internal/clients
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx
      - path: internal/clients/
        linters:
          - gosec
        text: G704

formatters:
  enable:
    - gofmt
    - goimports
