version: "2"

run:
  build-tags:
    - e2e
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    depguard:
      rules:
        database:
          files:
            - $all
            - "!**/storage/**"
            - "!**/internal/lib/pg/**"
          deny:
            - pkg: gorm.io
              desc: database access lives only in storage packages
            - pkg: github.com/jackc/pgx
              desc: database access lives only in storage packages
        users:
          files:
            - "**/internal/users/**"
          deny:
            - pkg: github.com/egor/k3s-base/internal/orders
              desc: services never import each other, they talk over HTTP through internal/clients
            - pkg: github.com/egor/k3s-base/internal/admin
              desc: services never import each other, they talk over HTTP through internal/clients
            - pkg: github.com/egor/k3s-base/internal/common
              desc: services never import each other, they talk over HTTP through internal/clients
        orders:
          files:
            - "**/internal/orders/**"
          deny:
            - pkg: github.com/egor/k3s-base/internal/users
              desc: services never import each other, they talk over HTTP through internal/clients
            - pkg: github.com/egor/k3s-base/internal/admin
              desc: services never import each other, they talk over HTTP through internal/clients
            - pkg: github.com/egor/k3s-base/internal/common
              desc: services never import each other, they talk over HTTP through internal/clients
        admin:
          files:
            - "**/internal/admin/**"
          deny:
            - pkg: github.com/egor/k3s-base/internal/users
              desc: services never import each other, they talk over HTTP through internal/clients
            - pkg: github.com/egor/k3s-base/internal/orders
              desc: services never import each other, they talk over HTTP through internal/clients
            - pkg: github.com/egor/k3s-base/internal/common
              desc: services never import each other, they talk over HTTP through internal/clients
        common:
          files:
            - "**/internal/common/**"
          deny:
            - pkg: github.com/egor/k3s-base/internal/users
              desc: services never import each other, they talk over HTTP through internal/clients
            - pkg: github.com/egor/k3s-base/internal/orders
              desc: services never import each other, they talk over HTTP through internal/clients
            - pkg: github.com/egor/k3s-base/internal/admin
              desc: services never import each other, they talk over HTTP through internal/clients
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx
      - path: internal/gateway/admin\.go
        linters:
          - gosec
        text: G101
      - path: internal/clients/
        linters:
          - gosec
        text: G704

formatters:
  enable:
    - gofmt
    - goimports
