components:
  schemas:
    Error:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          items:
            type: string
          nullable: true
          type: array
        message:
          type: string
      required:
        - code
        - message
      type: object
    Job:
      additionalProperties: false
      properties:
        name:
          type: string
        next_run:
          format: date-time
          type: string
        schedule:
          type: string
        timeout_seconds:
          format: int64
          type: integer
      required:
        - name
        - schedule
        - timeout_seconds
        - next_run
      type: object
    ListJobsResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Job"
          nullable: true
          type: array
      required:
        - items
      type: object
    Run:
      additionalProperties: false
      properties:
        duration_ms:
          format: int64
          type: integer
        error:
          type: string
        job:
          type: string
        status:
          enum:
            - succeeded
            - failed
          type: string
      required:
        - job
        - status
        - duration_ms
      type: object
info:
  title: scheduler internal
  version: dev
openapi: 3.0.3
paths:
  /internal/v1/scheduler/jobs:
    get:
      operationId: internal-list-jobs
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListJobsResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: List scheduled jobs
      tags:
        - Internal
  /internal/v1/scheduler/jobs/{name}/run:
    post:
      operationId: internal-run-job
      parameters:
        - in: path
          name: name
          required: true
          schema:
            maxLength: 100
            pattern: ^[a-z0-9-]+$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      summary: Run a job now and wait for the result
      tags:
        - Internal
