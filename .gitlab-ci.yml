stages:
  - test
  - build
  - deploy

variables:
  REGISTRY: $CI_REGISTRY_IMAGE
  HELMFILE: helmfile -f infra/deploy/helmfile.yaml.gotmpl

go:
  stage: test
  image: golang:1.26
  script:
    - cd app
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go vet -tags e2e ./e2e
    - go test -race -count=1 ./...

golangci-lint:
  stage: test
  image: golangci/golangci-lint:v2.15.0
  script:
    - cd app
    - golangci-lint run ./...

openapi:
  stage: test
  image: golang:1.26
  script:
    - cd app
    - go run ./openapi
    - git diff --exit-code -- openapi internal/gateway

integration:
  stage: test
  image: golang:1.26
  services:
    - docker:28-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - cd app
    - go test -tags integration -count=1 ./...

helm:
  stage: test
  image:
    name: ghcr.io/helmfile/helmfile:v1.8.2
    entrypoint: [""]
  variables:
    REGISTRY: lint.invalid
    TAG: lint
  script:
    - $HELMFILE -e local lint
    - if [ -n "$SOPS_AGE_KEY" ]; then $HELMFILE -e dev lint && $HELMFILE -e prod lint; fi

terraform:
  stage: test
  image:
    name: hashicorp/terraform:1.16
    entrypoint: [""]
  script:
    - cd infra/terraform
    - terraform fmt -check -recursive
    - terraform init -backend=false -input=false
    - terraform validate

images:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use
    - |
      for service in $(ls app/cmd); do
        docker buildx build --push \
          --platform linux/amd64,linux/arm64 \
          --build-arg SERVICE=$service \
          --build-arg VERSION=$CI_COMMIT_TAG \
          --build-arg COMMIT=$CI_COMMIT_SHA \
          --provenance=mode=max \
          --sbom=true \
          --tag $REGISTRY/$service:$CI_COMMIT_TAG app || exit 1
      done

scan:
  stage: build
  needs: [images]
  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - |
      for service in $(ls app/cmd); do
        trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 $REGISTRY/$service:$CI_COMMIT_TAG || exit 1
      done

.deploy:
  stage: deploy
  image:
    name: ghcr.io/helmfile/helmfile:v1.8.2
    entrypoint: [""]
  variables:
    TAG: $CI_COMMIT_TAG
  resource_group: $CI_ENVIRONMENT_NAME
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - '[ -n "$SOPS_AGE_KEY" ] && [ -n "$KUBECONFIG" ] || { echo "set the CI/CD variables SOPS_AGE_KEY (the age private key) and KUBECONFIG (type File)"; exit 1; }'
    - $HELMFILE -e $CI_ENVIRONMENT_NAME sync

deploy-dev:
  extends: .deploy
  needs: [scan]
  environment:
    name: dev

deploy-prod:
  extends: .deploy
  needs: [deploy-dev]
  environment:
    name: prod
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
