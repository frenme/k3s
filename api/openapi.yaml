openapi: 3.0.3
info:
  title: k3s-base API
  version: 1.0.0
  description: Public API served by the gateway.
servers:
  - url: /
security: []
tags:
  - name: users
    description: User accounts
  - name: orders
    description: Orders placed by users
paths:
  /api/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/users/{id}:
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List orders, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create an order, safe to retry with the same Idempotency-Key
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "200":
          description: Existing order returned for a repeated Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: User does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: Users service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get an order
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded at the ingress
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
    User:
      type: object
      required: [id, email, name, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
    UserList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
    CreateUser:
      type: object
      required: [email, name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
    Order:
      type: object
      required: [id, user_id, item, amount_cents, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        item:
          type: string
        amount_cents:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
    OrderList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
    CreateOrder:
      type: object
      required: [user_id, item, amount_cents]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        item:
          type: string
          minLength: 1
        amount_cents:
          type: integer
          format: int64
          minimum: 0
