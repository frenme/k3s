components:
  schemas:
    Config:
      additionalProperties: false
      properties:
        key:
          type: string
        value: {}
      required:
        - key
        - value
      type: object
    Error:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          items:
            type: string
          nullable: true
          type: array
        message:
          type: string
      required:
        - code
        - message
      type: object
info:
  title: common internal
  version: dev
openapi: 3.0.3
paths:
  /internal/v1/common/config/{key}:
    get:
      operationId: internal-get-config
      parameters:
        - in: path
          name: key
          required: true
          schema:
            maxLength: 100
            pattern: ^[a-z0-9_]+$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      summary: Any config entry by key for other services
      tags:
        - Internal
