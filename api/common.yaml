components:
  schemas:
    Error:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          items:
            type: string
          nullable: true
          type: array
        message:
          type: string
      required:
        - code
        - message
      type: object
    HealthResponseBody:
      additionalProperties: false
      properties:
        services:
          items:
            $ref: "#/components/schemas/Service"
          nullable: true
          type: array
        status:
          enum:
            - ok
            - degraded
          type: string
      required:
        - status
        - services
      type: object
    ListSettingsResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Setting"
          nullable: true
          type: array
      required:
        - items
      type: object
    Service:
      additionalProperties: false
      properties:
        healthy:
          type: boolean
        name:
          type: string
      required:
        - name
        - healthy
      type: object
    Setting:
      additionalProperties: false
      properties:
        key:
          type: string
        value: {}
      required:
        - key
        - value
      type: object
info:
  title: common
  version: dev
openapi: 3.0.3
paths:
  /v1/common/health:
    get:
      operationId: app-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponseBody"
          description: OK
        "503":
          description: At least one service is not ready
      summary: Health of every service, 503 when any of them is not ready
      tags:
        - Health
  /v1/common/settings:
    get:
      operationId: list-public-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSettingsResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Settings visible to clients
      tags:
        - Settings
servers:
  - url: /api
