image:
  repository: k3s-base/web

replicaCount: 2

nodeSelector:
  role: edge

securityContext:
  runAsUser: 101
  runAsGroup: 101
  readOnlyRootFilesystem: false

probes:
  readiness:
    path: /healthz

ingress:
  enabled: true
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
