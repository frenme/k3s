image:
  repository: k3s-base/web

nodeSelector:
  role: edge

securityContext:
  runAsUser: 101
  runAsGroup: 101
  readOnlyRootFilesystem: false

probes:
  readiness:
    path: /healthz

ingress:
  enabled: true
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
