env:
  ROUTES: users=http://users:8080,orders=http://orders:8080
  CORS_ORIGINS: ""

terminationGracePeriodSeconds: 90

nodeSelector:
  role: edge

spread:
  enabled: true

pdb:
  enabled: true

ingress:
  enabled: true
  hosts:
    - host: ""
      paths:
        - path: /api/users
          pathType: Prefix
          rateLimit:
            average: 120
            period: 1m
            burst: 40
        - path: /api/orders
          pathType: Prefix
          rateLimit:
            average: 60
            period: 1m
            burst: 20
        - path: /api
          pathType: Prefix
          rateLimit:
            average: 300
            period: 1m
            burst: 100

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

metrics:
  serviceMonitor:
    enabled: true
