image:
  repository: k3s-base/users

env:
  DB_SCHEMA: users
  DB_MAX_CONNS: "10"
  REDIS_ADDR: redis:6379

secretEnv:
  DATABASE_URL: ""
  DATABASE_READ_URL: ""
  REDIS_PASSWORD: ""

nodeSelector:
  role: core

spread:
  enabled: true

pdb:
  enabled: true

networkPolicy:
  enabled: true
  allowFromPods:
    - gateway
    - orders

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
