resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

autoscaling:
  minReplicas: 3
  maxReplicas: 10

env:
  CORS_ORIGINS: https://example.com

ingress:
  hosts:
    - host: api.example.com
      paths:
        - path: /api/users
          pathType: Prefix
          rateLimit:
            average: 600
            period: 1m
            burst: 200
        - path: /api/orders
          pathType: Prefix
          rateLimit:
            average: 300
            period: 1m
            burst: 100
  tls:
    - secretName: api-example-com-tls
      hosts:
        - api.example.com
