resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

autoscaling:
  minReplicas: 3
  maxReplicas: 10
  scaleDownStabilizationSeconds: 300

env:
  CORS_ORIGINS: https://example.com

ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.example.com
      paths:
        - path: /api/users
          pathType: Prefix
          rateLimit:
            average: 600
            period: 1m
            burst: 200
        - path: /api/orders
          pathType: Prefix
          rateLimit:
            average: 300
            period: 1m
            burst: 100
        - path: /api
          pathType: Prefix
          rateLimit:
            average: 1200
            period: 1m
            burst: 400
  tls:
    - secretName: api-example-com-tls
      hosts:
        - api.example.com
