env:
  CORS_ORIGINS: https://dev.example.com

autoscaling:
  minReplicas: 1
  maxReplicas: 3

ingress:
  hosts:
    - host: api.dev.example.com
      paths:
        - path: /api/users
          pathType: Prefix
          rateLimit:
            average: 120
            period: 1m
            burst: 40
        - path: /api/orders
          pathType: Prefix
          rateLimit:
            average: 60
            period: 1m
            burst: 20
        - path: /api
          pathType: Prefix
          rateLimit:
            average: 300
            period: 1m
            burst: 100
  tls:
    - secretName: api-dev-example-com-tls
      hosts:
        - api.dev.example.com
