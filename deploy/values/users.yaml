image:
  repository: k3s-base/users

env:
  DB_SCHEMA: users
  DB_MAX_CONNS: "10"

secretEnv:
  DATABASE_URL: postgres://users_svc:dev-users-password@postgres:5432/app?sslmode=disable
  DATABASE_READ_URL: postgres://users_svc:dev-users-password@postgres-ro:5432/app?sslmode=disable

nodeSelector:
  role: core

spread:
  enabled: true

pdb:
  enabled: true

networkPolicy:
  enabled: true
  allowFromPods:
    - gateway
    - orders

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
