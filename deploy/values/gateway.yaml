image:
  repository: k3s-base/gateway

env:
  ROUTES: users=http://users:8080,orders=http://orders:8080
  REDIS_ADDR: redis:6379
  RATE_LIMIT: "120"
  RATE_WINDOW: 1m

terminationGracePeriodSeconds: 90

nodeSelector:
  role: edge

spread:
  enabled: true

pdb:
  enabled: true

ingress:
  enabled: true
  hosts:
    - host: ""
      paths:
        - path: /api
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
