nameOverride: ""
fullnameOverride: ""

image:
  repository: k3s-base/service
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

env: {}

secretEnv: {}

probes:
  liveness:
    path: /healthz
  readiness:
    path: /readyz
  startup:
    path: /healthz

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

terminationGracePeriodSeconds: 30

drainDelay: 5s

automountServiceAccountToken: false

strategy:
  maxUnavailable: 0
  maxSurge: 1

nodeSelector: {}

tolerations: []

affinity: {}

spread:
  enabled: false
  topologyKey: kubernetes.io/hostname
  maxSkew: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 0
  scaleDownStabilizationSeconds: 120

pdb:
  enabled: false
  minAvailable: 1

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  allowFromPods: []
  allowFromNamespaces: []

podAnnotations: {}

podLabels: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

extraVolumes: []

extraVolumeMounts: []
