nameOverride: ""
fullnameOverride: ""

image:
  repository: k3s-base/service
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

env: {}

secretEnv: {}

probes:
  liveness:
    path: /healthz
  readiness:
    path: /readyz
  startup:
    path: /healthz

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi

terminationGracePeriodSeconds: 30

strategy:
  maxUnavailable: 0
  maxSurge: 1

nodeSelector: {}

tolerations: []

affinity: {}

