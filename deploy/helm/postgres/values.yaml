image:
  repository: postgres
  tag: 17-alpine
  pullPolicy: IfNotPresent

database: app

superuserPassword: ""

replication:
  user: replicator
  password: ""

services: {}

persistence:
  size: 5Gi
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

config:
  max_connections: "200"
  shared_buffers: 128MB
  effective_cache_size: 384MB
  wal_level: replica
  max_wal_size: 1GB
  max_wal_senders: "10"
  max_replication_slots: "10"
  wal_keep_size: 512MB
  max_slot_wal_keep_size: 2GB
  hot_standby: "on"
  hot_standby_feedback: "on"

nodeSelector: {}

tolerations: []

replica:
  enabled: false
  replicas: 1
  nodeSelector: {}
  tolerations: []
  resources: {}

backup:
  enabled: true
  schedule: "0 3 * * *"
  retentionDays: 7
  size: 5Gi
