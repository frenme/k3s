name: postgres

instances: 2

image: ghcr.io/cloudnative-pg/postgresql:17

database: app

services: {}

storage:
  size: 5Gi
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

parameters:
  max_connections: "200"
  shared_buffers: 128MB
  effective_cache_size: 384MB
  max_slot_wal_keep_size: 2GB

placement:
  preferredNodeLabels: {}
  antiAffinity: required

backup:
  enabled: false
  serverName: ""
  destinationPath: ""
  endpointURL: ""
  retention: 7d
  schedule: "0 0 3 * * *"
  accessKeyId: ""
  secretAccessKey: ""

restore:
  enabled: false
  serverName: postgres

networkPolicy:
  enabled: true
  operatorNamespace: cnpg-system
  allowFromPods: []
