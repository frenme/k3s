apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.superuserPassword | quote }}
  10-services.sql: |
    {{- range $name, $svc := .Values.services }}
    CREATE ROLE {{ $name }}_svc LOGIN PASSWORD {{ $svc.password | squote }};
    CREATE SCHEMA {{ $name }} AUTHORIZATION {{ $name }}_svc;
    ALTER ROLE {{ $name }}_svc SET search_path = {{ $name }};
    {{- end }}
