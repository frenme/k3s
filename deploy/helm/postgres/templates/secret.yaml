{{- if or (eq .Values.superuserPassword "change-me") (eq .Values.superuserPassword "") }}
{{- fail "set superuserPassword" }}
{{- end }}
{{- if or (eq .Values.replication.password "change-me") (eq .Values.replication.password "") }}
{{- fail "set replication.password" }}
{{- end }}
{{- range $name, $svc := .Values.services }}
{{- if eq (default "" $svc.password) "" }}
{{- fail (printf "set services.%s.password" $name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.superuserPassword | quote }}
  REPLICATION_PASSWORD: {{ .Values.replication.password | quote }}
  05-replication.sql: |
    CREATE ROLE {{ .Values.replication.user }} WITH REPLICATION LOGIN PASSWORD {{ .Values.replication.password | squote }};
  06-replication.sh: |
    echo "host replication {{ .Values.replication.user }} all scram-sha-256" >> "$PGDATA/pg_hba.conf"
  10-services.sql: |
    {{- range $name, $svc := .Values.services }}
    CREATE ROLE {{ $name }}_svc LOGIN PASSWORD {{ $svc.password | squote }};
    CREATE SCHEMA {{ $name }} AUTHORIZATION {{ $name }}_svc;
    ALTER ROLE {{ $name }}_svc SET search_path = {{ $name }};
    {{- end }}
    {{- range $name, $svc := .Values.services }}
    REVOKE ALL ON SCHEMA {{ $name }} FROM PUBLIC;
    {{- end }}
