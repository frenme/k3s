image:
  repository: redis
  tag: 7-alpine
  pullPolicy: IfNotPresent

mode: deployment

auth:
  password: ""

maxmemory: 256mb

maxmemoryPolicy: allkeys-lru

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 320Mi

nodeSelector: {}

tolerations: []

exporter:
  enabled: false
  image: oliver006/redis_exporter:v1.94.0
  podMonitor: false

networkPolicy:
  enabled: true
  allowFromPods: []
  metricsFromNamespaces: []
