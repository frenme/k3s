name: release

on:
  push:
    tags: ["v*"]

jobs:
  registry:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.registry.outputs.name }}
    steps:
      - id: registry
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  images:
    needs: registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, users, orders]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: build/go.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          push: true
          tags: ${{ needs.registry.outputs.name }}/${{ matrix.service }}:${{ github.ref_name }}

  dev:
    needs: [registry, images]
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: dev
      registry: ${{ needs.registry.outputs.name }}
    secrets: inherit

  prod:
    needs: [registry, dev]
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: prod
      registry: ${{ needs.registry.outputs.name }}
    secrets: inherit
