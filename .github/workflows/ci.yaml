name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  helm:
    runs-on: ubuntu-latest
    container: ghcr.io/helmfile/helmfile:v1.8.2
    steps:
      - uses: actions/checkout@v7
      - run: helmfile -f deploy/helmfile.yaml.gotmpl -e local lint
