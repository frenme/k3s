name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go vet -tags e2e ./e2e
      - run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - run: npx -y @redocly/cli@2.65.0 lint openapi.yaml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -tags integration -count=1 ./...

  helm:
    runs-on: ubuntu-latest
    container: ghcr.io/helmfile/helmfile:v1.8.2
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      REGISTRY: lint.invalid
      TAG: lint
    steps:
      - uses: actions/checkout@v7
      - run: helmfile -f deploy/helmfile.yaml.gotmpl -e local lint
      - if: env.SOPS_AGE_KEY != ''
        run: helmfile -f deploy/helmfile.yaml.gotmpl -e dev lint
      - if: env.SOPS_AGE_KEY != ''
        run: helmfile -f deploy/helmfile.yaml.gotmpl -e prod lint

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
