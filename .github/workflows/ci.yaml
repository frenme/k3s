name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          for c in service postgres redis; do helm lint deploy/helm/$c; done
          for s in users orders gateway web; do
            helm template $s deploy/helm/service -f deploy/values/$s.yaml > /dev/null
          done
          helm template postgres deploy/helm/postgres -f deploy/values/postgres.yaml > /dev/null
          helm template redis deploy/helm/redis -f deploy/values/redis.yaml > /dev/null
