components:
  schemas:
    AppConfig:
      additionalProperties: false
      properties:
        key:
          type: string
        value: {}
      required:
        - key
        - value
      type: object
    Check:
      additionalProperties: false
      properties:
        details:
          additionalProperties:
            type: string
          type: object
        error:
          type: string
        healthy:
          type: boolean
        kind:
          enum:
            - service
            - infra
          type: string
        latency_ms:
          format: int64
          type: integer
        name:
          type: string
      required:
        - name
        - kind
        - healthy
        - latency_ms
      type: object
    DetailsResponseBody:
      additionalProperties: false
      properties:
        checked_at:
          format: date-time
          type: string
        checks:
          items:
            $ref: "#/components/schemas/Check"
          nullable: true
          type: array
        status:
          enum:
            - ok
            - unhealthy
          type: string
      required:
        - checked_at
        - checks
        - status
      type: object
    Error:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          items:
            type: string
          nullable: true
          type: array
        message:
          type: string
      required:
        - code
        - message
      type: object
    ListAppConfigResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AppConfig"
          nullable: true
          type: array
      required:
        - items
      type: object
    StatusBody:
      additionalProperties: false
      properties:
        status:
          enum:
            - ok
            - unhealthy
          type: string
      required:
        - status
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: common
  version: dev
openapi: 3.0.3
paths:
  /v1/common/app-config:
    get:
      operationId: list-public-config
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAppConfigResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: AppConfig visible to clients
      tags:
        - AppConfig
      x-access: public
      x-cache-ttl: 10s
  /v1/common/health:
    get:
      operationId: app-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusBody"
          description: OK
        "503":
          description: At least one service or infrastructure component is down
      summary: Public liveness of every service and infrastructure component, 503 when anything is down
      tags:
        - Health
      x-access: public
  /v1/common/health/details:
    get:
      operationId: app-health-details
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailsResponseBody"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        "503":
          description: At least one service or infrastructure component is down
      security:
        - bearer: []
      summary: Per service and infrastructure health with error details, admin only at the gateway
      tags:
        - Health
      x-access: admin
servers:
  - url: /api
